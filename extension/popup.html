<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maps Scraper v1.1</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --term-bg: #0a0e27;
      --term-fg: #00ff41;
      --term-accent: #00d9ff;
      --term-warn: #ffaa00;
      --term-error: #ff3366;
      --term-border: #1a2332;
    }

    body {
      width: 450px;
      min-height: 600px;
      font-family: 'Courier New', monospace;
      background: var(--term-bg);
      color: var(--term-fg);
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
      pointer-events: none;
      z-index: 999;
      animation: flicker 0.15s infinite;
    }

    @keyframes flicker { 0%, 100% { opacity: 0.98; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 5px rgba(0,255,65,0.3); } 50% { box-shadow: 0 0 20px rgba(0,255,65,0.3); } }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

    .container { padding: 20px; position: relative; z-index: 1; }

    .terminal-header {
      background: var(--term-border);
      border: 2px solid var(--term-fg);
      border-radius: 8px 8px 0 0;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 20px rgba(0,255,65,0.3);
      margin-bottom: 2px;
    }

    .terminal-dots { display: flex; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; animation: pulse 2s infinite; }
    .dot.red { background: #ff3366; }
    .dot.yellow { background: #ffaa00; }
    .dot.green { background: #00ff41; }

    .terminal-title {
      flex: 1;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      color: var(--term-fg);
      text-shadow: 0 0 10px rgba(0,255,65,0.5);
      letter-spacing: 2px;
    }

    .terminal-version { color: var(--term-accent); font-size: 11px; }

    .terminal-body {
      background: var(--term-bg);
      border: 2px solid var(--term-fg);
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 20px;
      box-shadow: 0 0 30px rgba(0,255,65,0.3);
    }

    .prompt-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
      font-size: 13px;
      animation: slideIn 0.3s ease;
    }

    .prompt-symbol { color: var(--term-fg); font-weight: bold; }
    .prompt-text { color: var(--term-accent); }
    .cursor { display: inline-block; width: 8px; height: 16px; background: var(--term-fg); animation: blink 1s step-end infinite; }

    .settings-section {
      margin: 20px 0;
      padding: 15px;
      background: rgba(26, 35, 50, 0.5);
      border: 1px solid var(--term-border);
      border-radius: 4px;
      animation: slideIn 0.4s ease;
    }

    .setting-group { margin-bottom: 15px; }
    .setting-group:last-child { margin-bottom: 0; }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--term-fg);
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      background: #0a0e27;
      border: 2px solid var(--term-border);
      border-radius: 4px;
      color: var(--term-fg);
      font-family: 'Courier New', monospace;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--term-fg);
      box-shadow: 0 0 10px rgba(0,255,65,0.3);
    }

    .terminal-button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00ff41, #39ff14);
      border: none;
      border-radius: 4px;
      color: #0a0e27;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 255, 65, 0.4);
      position: relative;
      overflow: hidden;
    }

    .terminal-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s ease;
    }

    .terminal-button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 255, 65, 0.6); }
    .terminal-button:hover::before { left: 100%; }
    .terminal-button:active { transform: translateY(0); }
    .terminal-button:disabled { background: #1a2332; color: #4a5568; cursor: not-allowed; box-shadow: none; }

    .terminal-button.secondary {
      background: linear-gradient(135deg, #00d9ff, #0099ff);
      box-shadow: 0 4px 15px rgba(0, 217, 255, 0.4);
      margin-top: 10px;
    }
    .terminal-button.secondary:hover { box-shadow: 0 6px 20px rgba(0, 217, 255, 0.6); }

    .progress-section {
      margin: 20px 0;
      padding: 15px;
      background: rgba(26, 35, 50, 0.5);
      border: 1px solid var(--term-border);
      border-radius: 4px;
      display: none;
      animation: slideIn 0.4s ease;
    }
    .progress-section.active { display: block; }

    .progress-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 12px; }
    .progress-label { color: var(--term-fg); }
    .progress-value { color: var(--term-accent); font-weight: bold; }

    .progress-bar-container {
      width: 100%;
      height: 20px;
      background: #0a0e27;
      border: 2px solid var(--term-border);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #00ff41, #39ff14);
      width: 0%;
      transition: width 0.3s ease;
      box-shadow: 0 0 10px rgba(0,255,65,0.5);
      position: relative;
      overflow: hidden;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: shimmer 1.5s infinite;
    }

    .current-business {
      margin-top: 10px;
      font-size: 12px;
      color: var(--term-accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stats-section {
      margin: 20px 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      animation: slideIn 0.5s ease;
    }

    .stat-card {
      background: rgba(26, 35, 50, 0.5);
      border: 1px solid var(--term-border);
      border-radius: 4px;
      padding: 12px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .stat-card:hover { border-color: var(--term-fg); box-shadow: 0 0 15px rgba(0,255,65,0.3); transform: translateY(-2px); }

    .stat-label {
      font-size: 10px;
      color: var(--term-fg);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 20px;
      color: var(--term-accent);
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0,217,255,0.5);
    }

    .message-box {
      margin: 15px 0;
      padding: 12px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
      animation: slideIn 0.3s ease;
      border-left: 4px solid;
    }

    .message-box.show { display: block; }
    .message-box.success { background: rgba(0, 255, 65, 0.1); border-color: var(--term-fg); color: var(--term-fg); }
    .message-box.error { background: rgba(255, 51, 102, 0.1); border-color: var(--term-error); color: var(--term-error); }
    .message-box.info { background: rgba(0, 217, 255, 0.1); border-color: var(--term-accent); color: var(--term-accent); }

    .terminal-footer {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid var(--term-border);
      text-align: center;
      font-size: 10px;
      color: var(--term-fg);
      opacity: 0.6;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0a0e27; }
    ::-webkit-scrollbar-thumb { background: var(--term-fg); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--term-accent); }
  </style>
</head>
<body>
  <div class="container">
    <div class="terminal-header">
      <div class="terminal-dots">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
      <div class="terminal-title">
        MAPS_SCRAPER <span class="terminal-version">v1.1</span>
      </div>
    </div>

    <div class="terminal-body">
      <div class="prompt-line">
        <span class="prompt-symbol">$</span>
        <span class="prompt-text">maps-scraper --init</span>
        <span class="cursor"></span>
      </div>

      <div class="settings-section">
        <div class="setting-group">
          <label for="maxResults">⚡ Max Results (0 = All)</label>
          <input type="number" id="maxResults" min="0" value="20" placeholder="0">
        </div>
        <div class="setting-group">
          <label for="autoScrollDelay">⏱️ Scroll Delay (ms)</label>
          <input type="number" id="autoScrollDelay" min="500" step="100" value="2000" placeholder="2000">
        </div>
      </div>

      <button id="scrapeBtn" class="terminal-button">
        ▶ Execute Scraper
      </button>

      <button id="exportBtn" class="terminal-button secondary" disabled>
        ⬇ Export Data.csv
      </button>

      <div id="progressSection" class="progress-section">
        <div class="progress-header">
          <span class="progress-label">EXTRACTING DATA...</span>
          <span class="progress-value" id="progressText">0/0</span>
        </div>
        <div class="progress-bar-container">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <div class="current-business" id="currentBusiness">
          > Initializing...
        </div>
      </div>

      <div class="stats-section">
        <div class="stat-card">
          <div class="stat-label">Total</div>
          <div class="stat-value" id="totalStat">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg★</div>
          <div class="stat-value" id="avgRating">0.0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Status</div>
          <div class="stat-value" id="statusStat" style="font-size: 12px;">READY</div>
        </div>
      </div>

      <div id="messageBox" class="message-box"></div>

      <div class="terminal-footer">
        &gt; ULTRA_POWER_MODE:ENABLED | ASYNC:TRUE | OPTIMIZED:v1.1
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
